# Market-intelligence study pipeline (docs/RESEARCH.md). Projects call it from a
# manually started workflow:
#   jobs:
#     research:
#       permissions:
#         contents: write
#       uses: Renso0905/ai-factory/.github/workflows/research.yml@v1
#       with:
#         study: <study id with an approved contract on the default branch>
#       secrets:
#         claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#         gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
#
# Researcher (Claude) and reviewer (Gemini via Antigravity CLI) take turns:
# research -> review 1 -> respond -> review 2 -> report (round 2 only when the
# contract allows two rounds). Each agent job has a read-only token and only its
# own credential. The study is handed between jobs as an artifact. Only the last
# job may push, and it pushes a new branch for the owner to open as a pull request.
name: Research study (reusable)

on:
  workflow_call:
    inputs:
      study:
        description: Study id under research/ with an approved contract on the default branch.
        type: string
        required: true
      researcher-model:
        description: Claude model for the researcher.
        type: string
        default: claude-opus-5-5
      reviewer-model:
        description: Gemini model slug for the reviewer (see the "Models available" list in a run log). Empty uses the CLI default.
        type: string
        default: ''
      factory-ref:
        description: Factory ref the scripts are loaded from. Keep equal to the ref this workflow is called at.
        type: string
        default: v1
    secrets:
      claude-oauth-token:
        description: Claude subscription token from `claude setup-token`.
        required: true
      gemini-api-key:
        description: Free-tier Gemini API key (project with no billing account).
        required: true

permissions:
  contents: read

concurrency:
  group: research-${{ github.repository }}-${{ inputs.study }}
  cancel-in-progress: false

env:
  STUDY: ${{ inputs.study }}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rounds: ${{ steps.contract.outputs.rounds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false
      - name: Check the study and read its contract
        id: contract
        working-directory: project
        run: |
          node --input-type=module -e '
            import { readdirSync, readFileSync, appendFileSync } from "node:fs";
            const study = process.env.STUDY;
            if (!/^[a-z0-9][a-z0-9-]{2,79}$/.test(study)) throw new Error("Invalid study id.");
            const dir = `research/${study}`;
            const files = readdirSync(dir, { recursive: true }).map(String);
            const versions = files.map((f) => /^contract\.v(\d+)\.json$/.exec(f)).filter(Boolean).map((m) => Number(m[1]));
            if (versions.length === 0) throw new Error(`No approved contract in ${dir}. Merge contract.v1.json first.`);
            if (files.some((f) => f.startsWith("claims"))) throw new Error(`${dir} already has claims. This pipeline starts a new study.`);
            const contract = JSON.parse(readFileSync(`${dir}/contract.v${Math.max(...versions)}.json`, "utf8"));
            const rounds = Math.min(2, Math.max(1, Number(contract.maxReviewRounds) || 1));
            appendFileSync(process.env.GITHUB_OUTPUT, `rounds=${rounds}\n`);
            console.log(`Study ${study}: contract v${Math.max(...versions)}, ${rounds} review round(s).`);
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: study-state
          path: project/research/${{ inputs.study }}
          retention-days: 30

  research:
    name: researcher round 1
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Renso0905/ai-factory
          ref: ${{ inputs.factory-ref }}
          path: factory
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: study-state
          path: project/research/${{ inputs.study }}
      - name: Researcher
        env:
          FACTORY: ${{ github.workspace }}/factory
          PROJECT: ${{ github.workspace }}/project
          SNAPSHOTS: ${{ runner.temp }}/sources
          MODEL: ${{ inputs.researcher-model }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude-oauth-token }}
        run: bash factory/scripts/research/run-agent.sh researcher research 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: study-state
          path: project/research/${{ inputs.study }}
          overwrite: true
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sources-researcher-1
          path: ${{ runner.temp }}/sources
          if-no-files-found: ignore
          retention-days: 30

  review-1:
    name: reviewer round 1
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Renso0905/ai-factory
          ref: ${{ inputs.factory-ref }}
          path: factory
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: study-state
          path: project/research/${{ inputs.study }}
      - name: Reviewer
        env:
          FACTORY: ${{ github.workspace }}/factory
          PROJECT: ${{ github.workspace }}/project
          SNAPSHOTS: ${{ runner.temp }}/sources
          MODEL: ${{ inputs.reviewer-model }}
          GEMINI_API_KEY: ${{ secrets.gemini-api-key }}
        run: bash factory/scripts/research/run-agent.sh reviewer review 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: study-state
          path: project/research/${{ inputs.study }}
          overwrite: true
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sources-reviewer-1
          path: ${{ runner.temp }}/sources
          if-no-files-found: ignore
          retention-days: 30

  respond:
    name: researcher round 2
    needs: [prepare, review-1]
    if: needs.prepare.outputs.rounds == '2'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Renso0905/ai-factory
          ref: ${{ inputs.factory-ref }}
          path: factory
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: study-state
          path: project/research/${{ inputs.study }}
      - name: Researcher
        env:
          FACTORY: ${{ github.workspace }}/factory
          PROJECT: ${{ github.workspace }}/project
          SNAPSHOTS: ${{ runner.temp }}/sources
          MODEL: ${{ inputs.researcher-model }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude-oauth-token }}
        run: bash factory/scripts/research/run-agent.sh researcher respond 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: study-state
          path: project/research/${{ inputs.study }}
          overwrite: true
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sources-researcher-2
          path: ${{ runner.temp }}/sources
          if-no-files-found: ignore
          retention-days: 30

  review-2:
    name: reviewer round 2
    needs: respond
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Renso0905/ai-factory
          ref: ${{ inputs.factory-ref }}
          path: factory
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: study-state
          path: project/research/${{ inputs.study }}
      - name: Reviewer
        env:
          FACTORY: ${{ github.workspace }}/factory
          PROJECT: ${{ github.workspace }}/project
          SNAPSHOTS: ${{ runner.temp }}/sources
          MODEL: ${{ inputs.reviewer-model }}
          GEMINI_API_KEY: ${{ secrets.gemini-api-key }}
        run: bash factory/scripts/research/run-agent.sh reviewer review 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: study-state
          path: project/research/${{ inputs.study }}
          overwrite: true
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sources-reviewer-2
          path: ${{ runner.temp }}/sources
          if-no-files-found: ignore
          retention-days: 30

  report:
    name: researcher report
    needs: [prepare, review-1, review-2]
    if: ${{ !cancelled() && needs.review-1.result == 'success' && (needs.review-2.result == 'success' || (needs.review-2.result == 'skipped' && needs.prepare.outputs.rounds == '1')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Renso0905/ai-factory
          ref: ${{ inputs.factory-ref }}
          path: factory
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: study-state
          path: project/research/${{ inputs.study }}
      - name: Researcher
        env:
          FACTORY: ${{ github.workspace }}/factory
          PROJECT: ${{ github.workspace }}/project
          SNAPSHOTS: ${{ runner.temp }}/sources
          MODEL: ${{ inputs.researcher-model }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude-oauth-token }}
          ROUNDS: ${{ needs.prepare.outputs.rounds }}
        run: bash factory/scripts/research/run-agent.sh researcher report "$ROUNDS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: study-state
          path: project/research/${{ inputs.study }}
          overwrite: true
          retention-days: 30

  # The only job with write access. It runs no agent and re-checks the whole
  # study with a fresh copy of the factory before pushing a branch.
  publish:
    name: publish
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Renso0905/ai-factory
          ref: ${{ inputs.factory-ref }}
          path: factory
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: study-state
          path: ${{ runner.temp }}/study
      - name: Commit the study to a new branch and re-check it
        working-directory: project
        env:
          RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          base="$(git rev-parse HEAD)"
          branch="research/$STUDY-$RUN_ID"
          git switch -c "$branch"
          rm -rf "research/$STUDY"
          mkdir -p "research/$STUDY"
          cp -R "$RUNNER_TEMP/study/." "research/$STUDY/"
          git add -A "research/$STUDY"
          if git diff --cached --name-only | grep -qv "^research/$STUDY/"; then echo "Unexpected files staged." >&2; exit 1; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Research study $STUDY (run $RUN_ID)"
          node ../factory/scripts/policy-check.ts --target . --mode project --base "$base"
          git push -q origin "$branch"
          {
            echo "## Study $STUDY is ready for review"
            echo ""
            echo "Branch \`$branch\` passed the factory policy check (R001 to R003)."
            echo "[Open a pull request]($SERVER/$REPO/compare/$DEFAULT_BRANCH...$branch?expand=1) to read the report and merge the record."
          } >> "$GITHUB_STEP_SUMMARY"
